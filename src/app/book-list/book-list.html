
<!-- Book Browser: displays all available books -->


<p>Welcome! Browse our collection of books below.</p>
<p>
  <a routerLink="/books/new">➕ Add New Book</a>
</p>

<div class="book-container">
  @for (book of books(); track book.id) {
    <div class="book-card">
      <h2>{{ book.title }}</h2>
      <p><strong>Author:</strong> {{ book.author }}</p>
      <p>{{ book.description }}</p>

      <a [routerLink]="['/books', book.id]">
        View Details
      </a>

<a [routerLink]="['/books/edit', book.id]">
  ✏️ Edit Book
</a>


      <button (click)="deleteBook(book.id)">
        Delete Book
      </button>
    </div>
  } @empty {
    <p>No books available.</p>
  }
</div>
